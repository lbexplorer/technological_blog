<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="42%" stop-color="#071b3a"/>
      <stop offset="72%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <radialGradient id="nebula1" cx="30%" cy="25%" r="55%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity=".42"/>
      <stop offset="42%" stop-color="#2563eb" stop-opacity=".16"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nebula2" cx="76%" cy="34%" r="48%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity=".34"/>
      <stop offset="42%" stop-color="#4f46e5" stop-opacity=".13"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="62%" r="50%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity=".18"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur">
      <feGaussianBlur stdDeviation="40"/>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="2.4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="grid" width="72" height="72" patternUnits="userSpaceOnUse">
      <path d="M72 0H0V72" fill="none" stroke="#60a5fa" stroke-opacity=".10" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1920" height="1080" fill="url(#bg)"/>
  <rect width="1920" height="1080" fill="url(#nebula1)" filter="url(#blur)"/>
  <rect width="1920" height="1080" fill="url(#nebula2)" filter="url(#blur)"/>
  <rect width="1920" height="1080" fill="url(#glow)"/>
  <rect width="1920" height="1080" fill="url(#grid)" opacity=".55"/>

  <g opacity=".42" stroke="#38bdf8" stroke-width="1">
