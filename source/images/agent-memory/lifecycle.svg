<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img" aria-labelledby="title desc"><title id="title">记忆生命周期</title><desc id="desc">交互经过候选提取和筛选合并进入存储；查询通过检索重排和上下文组装读取记忆；更新删除贯穿整个过程。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="none" stroke="#6383ac" stroke-width="1.8"/></marker></defs><rect width="960" height="440" rx="14" fill="#f5f8fc"/><g font-family="Segoe UI,Microsoft YaHei,sans-serif"><text x="40" y="45" fill="#52729d" font-size="13" letter-spacing="3">MEMORY / LIFECYCLE</text><text x="40" y="86" fill="#203652" font-size="27" font-weight="600">先保存可靠证据，再选择相关信息。</text><g fill="#fff" stroke="#ccd9ea"><rect x="40" y="130" width="230" height="86" rx="9"/><rect x="365" y="130" width="230" height="86" rx="9"/><rect x="690" y="130" width="230" height="86" rx="9"/><rect x="40" y="257" width="230" height="86" rx="9"/><rect x="365" y="257" width="230" height="86" rx="9"/><rect x="690" y="257" width="230" height="86" rx="9"/></g><g fill="none" stroke="#6383ac" stroke-width="2" marker-end="url(#a)"><path d="M272 173H358"/><path d="M597 173H683"/><path d="M805 219V249"/><path d="M688 300H604"/><path d="M363 300H279"/></g><g fill="#203652" font-size="20"><text x="62" y="165">01 提取候选</text><text x="387" y="165">02 筛选与合并</text><text x="712" y="165">03 持久存储</text><text x="712" y="292">04 检索与重排</text><text x="387" y="292">05 组装上下文</text><text x="62" y="292">06 回答与行动</text></g><g fill="#5c718d" font-size="15"><text x="62" y="195">原始消息 → 带来源的记录</text><text x="387" y="195">确认事实 · 去重 · 查冲突</text><text x="712" y="195">记录 + 索引 + 版本</text><text x="712" y="322">范围过滤 → 相关证据</text><text x="387" y="322">时间 · 来源 · token 预算</text><text x="62" y="322">检查结果，形成新的交互</text></g><rect x="40" y="370" width="880" height="43" rx="8" fill="#e5f1ec"/><text x="65" y="398" font-size="15" fill="#2b6550">贯穿各阶段：权限隔离 · 证据追溯 · 冲突更新 · 删除原文及派生索引</text></g></svg>
