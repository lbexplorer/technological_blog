<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" role="img" aria-labelledby="title desc"><title id="title">记忆的两个分类维度</title><desc id="desc">工作上下文保存当前需要的信息，持久层按用途组织情节、语义和程序记忆。</desc><rect width="960" height="480" rx="14" fill="#f5f8fc"/><g font-family="Segoe UI,Microsoft YaHei,sans-serif"><text x="40" y="45" fill="#52729d" font-size="13" letter-spacing="3">MEMORY / SCOPE AND PURPOSE</text><text x="40" y="88" fill="#203652" font-size="27" font-weight="600">保存多久，与记住什么，是两个问题。</text><rect x="40" y="119" width="880" height="83" rx="10" fill="#3866ad"/><text x="65" y="152" fill="white" font-size="20">工作上下文</text><text x="65" y="182" fill="#e3edff" font-size="16">当前目标、近期对话，以及从长期记忆中选择的证据</text><text x="450" y="231" fill="#52729d" font-size="18">↑ 按需装入</text><g fill="#fff" stroke="#ccd9ea"><rect x="40" y="258" width="278" height="163" rx="10"/><rect x="341" y="258" width="278" height="163" rx="10"/><rect x="642" y="258" width="278" height="163" rx="10"/></g><g fill="#203652" font-size="23"><text x="65" y="298">情节记忆</text><text x="366" y="298">语义记忆</text><text x="667" y="298">程序记忆</text></g><g fill="#5c718d" font-size="16"><text x="65" y="332">发生过什么？</text><text x="65" y="365">事件、时间、执行结果</text><text x="65" y="397">例：某次测试失败记录</text><text x="366" y="332">已知什么？</text><text x="366" y="365">事实、偏好、概念关系</text><text x="366" y="397">例：用户偏好的讲解方式</text><text x="667" y="332">应该怎样做？</text><text x="667" y="365">步骤、策略、经验</text><text x="667" y="397">例：排错的检查顺序</text></g><text x="40" y="455" fill="#6d7e93" font-size="13">工程分类示意 · 持久层可以包含多种内容，分类不限定具体数据库或框架。</text></g></svg>
