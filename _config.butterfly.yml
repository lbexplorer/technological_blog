# Butterfly theme configuration
# Keep this file minimal and prefer configuration over theme source changes.

menu:
  主页: / || fas fa-home
  归档: /archives/ || fas fa-archive
  分类: /categories/ || fas fa-folder-open
  标签: /tags/ || fas fa-tags
  关于: /about/ || fas fa-heart

avatar:
  img:
  effect: false

social:

favicon: /hexo_blog_tech_assets/favicon.png

index_img: /hexo_blog_tech_assets/hero-starry-tech.webp
default_top_img:
archive_img:
tag_img:
category_img:

cover:
  index_enable: true
  aside_enable: true
  archives_enable: true
  position: both
  default_cover: /hexo_blog_tech_assets/card-tech-cover.svg

subtitle:
  enable: true
  effect: false
  typed_option:
  source: false
  sub:
    - 记录 AI、机器人、软件工程与科研实践

post_meta:
  page:
    date_type: created
    date_format: date
    categories: true
    tags: true
    label: true
  post:
    date_type: both
    date_format: date
    categories: true
    tags: true
    label: true

aside:
  enable: true
  hide: false
  button: true
  mobile: true
  position: right
  card_author:
    enable: true
    description: AI、机器人、软件工程与科研实践
    button:
      enable: false
      icon: fab fa-github
      text: Follow Me
      link:
  card_announcement:
    enable: true
    content: '<div class="tech-tag-cloud"><span>LLM</span><span>Robotics</span><span>ROS</span><span>Hexo</span><span>Software Engineering</span><span>UAV</span><span>Agent</span></div>'
  card_recent_post:
    enable: true
    limit: 5
    sort: date
    sort_order:
  card_categories:
    enable: true
    limit: 8
    expand: none
    sort_order:
  card_tags:
    enable: true
    limit: 40
    color: false
    orderby: random
    order: 1
    sort_order:
  card_archives:
    enable: true
    type: monthly
    format: MMMM YYYY
    order: -1
    limit: 8
    sort_order:
  card_webinfo:
    enable: true
    post_count: true
    last_push_date: true
    sort_order:

footer:
  owner:
    enable: true
    since: 2026
  custom_text:
  copyright: true

local_search:
  enable: false

comments:
  use:
  text: true
  lazyload: false
  count: false
  card_post_count: false

inject:
  head:
    - <link rel="stylesheet" href="/technological_blog/css/custom-tech.css">
  bottom:
